syntax = "proto3";

option csharp_namespace = "Wallet.GrpcContracts";

package wallet.v1;

import "google/protobuf/timestamp.proto";
import "Protos/v1/wallet_enums.proto";

message ReservationOperationGrpcResponse {
  int64 wallet_id = 1;
  int64 reservation_id = 2;
  optional int64 transaction_id = 3;
  WalletServiceType service_type = 4;
  string amount = 5;
  google.protobuf.Timestamp expires_at = 6;
  string status = 7;
  string available_balance = 8;
  string reserved_balance = 9;
}
