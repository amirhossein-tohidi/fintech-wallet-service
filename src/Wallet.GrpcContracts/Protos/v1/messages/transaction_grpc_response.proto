syntax = "proto3";

option csharp_namespace = "Wallet.GrpcContracts";

package wallet.v1;

import "google/protobuf/timestamp.proto";
import "Protos/v1/wallet_enums.proto";

message TransactionGrpcResponse {
  int64 transaction_id = 1;
  int64 wallet_id = 2;
  LedgerTransactionType transaction_type = 3;
  WalletServiceType service_type = 4;
  string amount = 5;
  optional int64 reference_id = 6;
  google.protobuf.Timestamp created_at = 7;
}
